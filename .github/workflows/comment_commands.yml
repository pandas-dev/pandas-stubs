name: Comment Commands
on:
  issue_comment:
    types: [created]

permissions: {}

env:
  # Open issues a contributor may hold at once; owners, members, and
  # collaborators are exempt.
  TAKE_LIMIT: 2
  DOCS_URL: https://pandas.pydata.org/docs/dev/development/contributing.html#issue-assignment-and-the-pull-request-lifecycle
  TAKE_BLOCKED: >-
    Thanks for your interest, @{user}! This issue is still labeled
    `{blocking}`, which means it needs another look before work starts — so
    it isn't open to claim just yet. Please hold off on a PR until that
    label is removed. See the [contributing guide]({docs}) for more.
  TAKE_ALREADY_YOURS: >-
    You already have this one, @{user} — it's assigned to you and you're all
    set to work on it.
  TAKE_LIMIT_REACHED: >-
    Thanks for your interest, @{user}! You're already assigned to {count} open
    issues, and contributors can hold at most {limit} at a time — so
    this one isn't available to claim right now. Once you've finished one of
    those, or released it with `/untake`, you're welcome to `/take` this
    issue. See the [contributing guide]({docs}) for more.
  TAKE_ASSIGNED_OTHER: >-
    Thanks @{user}! This issue is currently assigned to @{assignee}, who's
    already on it — so to avoid two people doing the same work, please pick a
    different available issue for now. If @{assignee} becomes inactive, the
    issue is released automatically and you'll be able to `/take` it then.
    See the [contributing guide]({docs}) for more.
  UNTAKE_NOT_ASSIGNED: >-
    @{user}, you're not currently assigned to this issue, so there's nothing
    to release. If you'd like to work on it, comment `/take` to claim it.
  UNTAKE_OPEN_PR: >-
    @{user}, you have an open pull request for this issue ({prs}), so it can't
    be released yet. Please close it first, then comment `/untake` again. If
    the pull request is for a different issue, link it to that issue with a
    closing keyword in the description (for example `closes #1234`) instead.
    See the [contributing guide]({docs}) for more.

jobs:
  optional_tests:
    name: "Optional tests run"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pull-requests: read
      contents: read
      checks: write
    # if more commands are added, they will need to be added here too as we don't have access to env at this stage
    if: (github.event.issue.pull_request) && contains(fromJSON('["/pandas_nightly", "/mypy_nightly", "/pyrefly_pre_release", "/pyrefly_all", "/ty_all"]'), github.event.comment.body) && github.event.comment.author_association == 'MEMBER'

    steps:
      - name: Resolve comment command
        id: command
        shell: bash
        env:
          COMMENT_BODY: ${{ github.event.comment.body }}
        run: |
          case "${COMMENT_BODY}" in
            /pandas_nightly)
              echo "poe_command=pytest --nightly" >> "${GITHUB_OUTPUT}"
              echo "check_name=Pandas nightly tests" >> "${GITHUB_OUTPUT}"
              ;;
            /mypy_nightly)
              echo "poe_command=mypy --mypy_nightly" >> "${GITHUB_OUTPUT}"
              echo "check_name=Mypy nightly tests" >> "${GITHUB_OUTPUT}"
              ;;
            /pyrefly_pre_release)
              echo "poe_command=pyrefly --pyrefly_pre_release" >> "${GITHUB_OUTPUT}"
              echo "check_name=Pyrefly latest tests" >> "${GITHUB_OUTPUT}"
              ;;
            /pyrefly_all)
              echo "poe_command=pyrefly_all" >> "${GITHUB_OUTPUT}"
              echo "check_name=Pyrefly tests all preset" >> "${GITHUB_OUTPUT}"
              ;;
            /ty_all)
              echo "poe_command=ty_all" >> "${GITHUB_OUTPUT}"
              echo "check_name=Ty tests all rules raising errors" >> "${GITHUB_OUTPUT}"
              ;;
            *)
              echo "Unknown command: ${COMMENT_BODY}" >&2
              exit 1
              ;;
          esac

      - name: Get head sha, branch name and store value
        # get the sha of the last commit to attach the results of the tests
        if: always()
        id: get-branch-info
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          PULL_NUMBER: ${{ github.event.issue.number }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const pr = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: Number(process.env.PULL_NUMBER),
            })
            core.setOutput('sha', pr.data.head.sha)
            core.setOutput('branch', pr.data.head.ref)
            core.setOutput('repository', pr.data.head.repo.full_name)

      - name: Checkout code on the correct branch
        uses: actions/checkout@v7
        with:
          # context is not aware which branch to checkout so it would otherwise
          # default to main (we also need repo name to source from the right user
          # otherwise it will look for the branch in pandas-stubs repo)
          ref: ${{ steps.get-branch-info.outputs.branch }}
          repository: ${{ steps.get-branch-info.outputs.repository }}
          persist-credentials: false

      - name: Install project dependencies
        uses: ./.github/setup
        with:
          os: ubuntu-latest
          python-version: "3.12"

      - name: Run optional tests
        # run the tests based on the value of the comment
        id: tests-step
        shell: bash
        env:
          POE_COMMAND: ${{ steps.command.outputs.poe_command }}
        run: poetry run poe $POE_COMMAND

      - name: Report results of the tests and publish
        # publish the results to a check run no matter the pass or fail
        if: always()
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          CHECK_NAME: ${{ steps.command.outputs.check_name }}
          HEAD_SHA: ${{ steps.get-branch-info.outputs.sha }}
          CONCLUSION: ${{ steps.tests-step.outcome }}
          ACTIONS_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            github.rest.checks.create({
              name: process.env.CHECK_NAME,
              head_sha: process.env.HEAD_SHA,
              status: 'completed',
              conclusion: process.env.CONCLUSION,
              output: {
                title: `Run ${process.env.CHECK_NAME}`,
                summary: `Results: ${process.env.CONCLUSION}`,
                text: `See the actions run at ${process.env.ACTIONS_RUN_URL}`,
              },
              owner: context.repo.owner,
              repo: context.repo.repo
            })

  take:
    runs-on: ubuntu-24.04
    permissions:
      issues: write
    if: >-
      github.repository_owner == 'pandas-dev' &&
      github.event.issue.pull_request == null &&
      startsWith(github.event.comment.body, '/take')
    concurrency:
      group: assign-${{ github.event.issue.number }}
    steps:
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            if (context.payload.comment.body.trim() !== '/take') return;
            const msg = (name, vars) => process.env[name].replace(
              /{(\w+)}/g, (_, key) => ({ docs: process.env.DOCS_URL, ...vars })[key]);
            // Avoid race condition between two different `/take` submissions
            const { data: issue } = await github.rest.issues.get({
              owner: context.repo.owner, repo: context.repo.repo, issue_number: context.payload.issue.number,
            });
            const user = context.payload.comment.user.login;
            const labels = issue.labels.map(label => typeof label === 'string' ? label : label.name);
            const assignees = issue.assignees.map(assignee => assignee.login);
            const blocking = ['Needs Discussion', 'Needs Info', 'Closing Candidate']
              .find(label => labels.includes(label));
            const comment = body => github.rest.issues.createComment({
              owner: context.repo.owner, repo: context.repo.repo, issue_number: issue.number, body,
            });
            if (blocking) {
              await comment(msg('TAKE_BLOCKED', { user, blocking }));
              return;
            }
            if (assignees.includes(user)) {
              await comment(msg('TAKE_ALREADY_YOURS', { user }));
              return;
            }
            if (assignees.length > 0) {
              await comment(msg('TAKE_ASSIGNED_OTHER', { user, assignee: assignees[0] }));
              return;
            }
            const exempt = ['OWNER', 'MEMBER', 'COLLABORATOR']
              .includes(context.payload.comment.author_association);
            if (!exempt) {
              const limit = Number(process.env.TAKE_LIMIT);
              const held = (await github.paginate(github.rest.issues.listForRepo, {
                owner: context.repo.owner, repo: context.repo.repo, assignee: user, state: 'open', per_page: 100,
              })).filter(item => !item.pull_request);
              if (held.length >= limit) {
                await comment(msg('TAKE_LIMIT_REACHED', { user, count: held.length, limit }));
                return;
              }
            }
            await github.rest.issues.addAssignees({
              owner: context.repo.owner, repo: context.repo.repo, issue_number: issue.number, assignees: [user],
            });
            await github.rest.reactions.createForIssueComment({
              owner: context.repo.owner, repo: context.repo.repo, comment_id: context.payload.comment.id, content: '+1',
            });

  untake:
    runs-on: ubuntu-24.04
    permissions:
      issues: write
      pull-requests: read
    if: >-
      github.repository_owner == 'pandas-dev' &&
      github.event.issue.pull_request == null &&
      startsWith(github.event.comment.body, '/untake')
    concurrency:
      group: assign-${{ github.event.issue.number }}
    steps:
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            if (context.payload.comment.body.trim() !== '/untake') return;
            const msg = (name, vars) => process.env[name].replace(
              /{(\w+)}/g, (_, key) => ({ docs: process.env.DOCS_URL, ...vars })[key]);
            // Avoid race condition between two different `/take` submissions
            const { data: issue } = await github.rest.issues.get({
              owner: context.repo.owner, repo: context.repo.repo, issue_number: context.payload.issue.number,
            });
            const user = context.payload.comment.user.login;
            const assignees = issue.assignees.map(assignee => assignee.login);
            if (!assignees.includes(user)) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo, issue_number: issue.number,
                body: msg('UNTAKE_NOT_ASSIGNED', { user }),
              });
              return;
            }
            const exempt = ['OWNER', 'MEMBER', 'COLLABORATOR']
              .includes(context.payload.comment.author_association);
            if (!exempt) {
              // Open PRs by the user that link this issue, or that referenced it
              // and no longer link any issue (e.g. the closing keyword was removed)
              const query = `query($owner: String!, $name: String!, $number: Int!, $cursor: String) {
                repository(owner: $owner, name: $name) {
                  issue(number: $number) {
                    closedByPullRequestsReferences(first: 50, includeClosedPrs: false) {
                      nodes { number author { login } }
                    }
                    timelineItems(first: 100, after: $cursor, itemTypes: [CROSS_REFERENCED_EVENT]) {
                      pageInfo { hasNextPage endCursor }
                      nodes {
                        ... on CrossReferencedEvent {
                          isCrossRepository
                          source {
                            ... on PullRequest {
                              number state author { login }
                              closingIssuesReferences(first: 1) { totalCount }
                            }
                          }
                        }
                      }
                    }
                  }
                }
              }`;
              const prs = new Set();
              let cursor = null;
              do {
                const { repository: { issue: data } } = await github.graphql(query, {
                  owner: context.repo.owner, name: context.repo.repo, number: issue.number, cursor,
                });
                for (const pr of data.closedByPullRequestsReferences.nodes) {
                  if (pr.author?.login === user) prs.add(pr.number);
                }
                for (const { isCrossRepository, source } of data.timelineItems.nodes) {
                  if (!isCrossRepository && source?.state === 'OPEN' && source.author?.login === user
                      && source.closingIssuesReferences.totalCount === 0) {
                    prs.add(source.number);
                  }
                }
                cursor = data.timelineItems.pageInfo.hasNextPage ? data.timelineItems.pageInfo.endCursor : null;
              } while (cursor);
              if (prs.size > 0) {
                await github.rest.issues.createComment({
                  owner: context.repo.owner, repo: context.repo.repo, issue_number: issue.number,
                  body: msg('UNTAKE_OPEN_PR', { user, prs: [...prs].map(n => `#${n}`).join(', ') }),
                });
                return;
              }
            }
            await github.rest.issues.removeAssignees({
              owner: context.repo.owner, repo: context.repo.repo, issue_number: issue.number, assignees: [user],
            });
            await github.rest.reactions.createForIssueComment({
              owner: context.repo.owner, repo: context.repo.repo, comment_id: context.payload.comment.id, content: '+1',
            });
