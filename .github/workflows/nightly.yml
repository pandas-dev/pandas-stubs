name: Nightly

on:
  schedule:
  # 00:23 / 08:23 / 16:23 UTC. The nightly version carries no date, so a slow
  # build cannot be told apart from an absent one: repeating the cron is what
  # covers it. The :23 offset avoids the top-of-hour congestion.
  - cron: "23 */8 * * *"
  workflow_dispatch:

env:
  MPLBACKEND: "Agg"

permissions: {}

jobs:
  nightly:
    if: github.repository == 'pandas-dev/pandas-stubs'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false

    - name: Install project dependencies
      uses: ./.github/setup
      with:
        os: ubuntu-latest
        python-version: '3.14'

    - name: Run pytest (against pandas nightly)
      run: poetry run poe pytest --nightly
