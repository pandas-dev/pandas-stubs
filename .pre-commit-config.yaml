minimum_pre_commit_version: 2.15.0
ci:
    autofix_prs: false
repos:
-   repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.1
    hooks:
    -   id: ruff-check
        args: [--exit-non-zero-on-fix]
-   repo: https://github.com/codespell-project/codespell
    rev: v2.4.3
    hooks:
    - id: codespell
      args: [-L, "THIRDPARTY"]
-   repo: https://github.com/PyCQA/isort
    rev: 8.0.1
    hooks:
    -   id: isort
-   repo: https://github.com/psf/black
    rev: 26.5.1
    hooks:
    -   id: black
-   repo: local
    hooks:
    -   id: check-ignore-spacing
        name: check typing ignore spacing
        entry: '#.*\]\s{2,}#'
        language: pygrep
        types_or: [python, pyi]
    -   id: guard-dunders-posonly
        name: Guard positional-only dunder methods (, /)
        entry: '(?s)\bdef __(?:lt|le|eq|ne|gt|ge|[ri]?(?:add|sub|mul|matmul|truediv|floordiv|mod|divmod|pow|lshift|rshift|and|xor|or)|getitem|setitem|delitem|contains|get|set|delete|round|format|reduce_ex|setstate|class_getitem|subclasshook|instancecheck|subclasscheck)__\((?:(?!/|\)\s*(?:->|:)).)*\)\s*(?:->|:)'
        language: pygrep
        types_or: [pyi, python]
        args: [--multiline]
        files: ^pandas-stubs/
